version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci --include=optional
        - npm install --no-save lightningcss-linux-x64-gnu@1.32.0 @tailwindcss/oxide-linux-x64-gnu@4.3.3
    build:
      commands:
        - |
          if [ -n "$API_URL" ]; then
            echo "API_URL=$API_URL" >> .env.production
            echo "NEXT_PUBLIC_API_URL=$API_URL" >> .env.production
          fi
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
