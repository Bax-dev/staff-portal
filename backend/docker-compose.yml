services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: organo
      POSTGRES_PASSWORD: organo
      POSTGRES_DB: staff_portal
    ports:
      - "5432:5432"
    volumes:
      - staff_portal_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - staff_portal_redis:/data

volumes:
  staff_portal_pg:
  staff_portal_redis:
