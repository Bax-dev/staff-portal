name: Deploy

on:
  push:
    branches: [staging, production]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  amplify:
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start Amplify release
        run: |
          aws amplify start-job \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name "${{ github.ref_name }}" \
            --job-type RELEASE

  api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build -t "$ECR_REGISTRY/smp-api:$IMAGE_TAG" backend
          docker push "$ECR_REGISTRY/smp-api:$IMAGE_TAG"
      - name: Wait for App Runner service to be ready
        run: |
          SERVICE_ARN="$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='smp-api-${{ github.ref_name }}'].ServiceArn | [0]" --output text)"
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "App Runner service smp-api-${{ github.ref_name }} does not exist yet."
            exit 1
          fi
          echo "SERVICE_ARN=$SERVICE_ARN" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            STATUS="$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.Status" --output text)"
            echo "Service status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              exit 0
            fi
            sleep 20
          done

          echo "Timed out waiting for smp-api-${{ github.ref_name }} to reach RUNNING."
          exit 1
      - name: Deploy App Runner
        run: aws apprunner start-deployment --service-arn "$SERVICE_ARN"
